[project]
name = "retroguard-classifier"
version = "0.0.0"
description = "In-enclave classifier (runs INSIDE Nitro Enclave; PolyForm Shield 1.0.0)."
requires-python = ">=3.12"
license = { text = "PolyForm Shield 1.0.0" }
dependencies = [
    "llama-cpp-python>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retroguard_classifier"]
